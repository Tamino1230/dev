    *{

    body::before{

        background:radial-gradient(circle,#9c27ff33,transparent 70%);

    }

    body::after{
        content:"";
        position:absolute;
        width:500px;
        height:500px;
        background:radial-gradient(circle,#7b2cff22,transparent 70%);
        left:-150px;
        bottom:-200px;
        pointer-events:none;
    }

    nav{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:35px 90px;
    }

    .logo{
        font-size:2rem;
        font-weight:700;
    }

        color:#b54cff;

    .home{

    }

    .container{

        color:#9b9b9b;

        line-height:1.6;

    }

    button{
        background:transparent;
        border:2px solid #7d35d8;

    .circle{
        width:340px;

        animation:float 4s ease-in-out infinite;

    .glow{
        position:absolute;
        inset:-20px;
        border-radius:50%;
        border:2px solid #b24cff33;
        animation:spin 20s linear infinite;
    }

    @keyframes float{
        0%,100%{
            transform:translateY(0px);
        }

            transform:translateY(-18px);
        }
    }

        from{
            transform:rotate(0deg);
        }
        to{
            transform:rotate(360deg);
        }
    }

    .code{
        position:fixed;

        left:50%;
        transform:translateX(-50%);

    #namesText {

    <body>
    <nav>
        <div class="logo">Tamino<span>1230</span></div>

        <a class="home" href="/">← Back Home</a>
    </nav>

    <div class="container">

        <div class="left">

            <div class="small">Error 404</div>

            <h1><span>Lost</span> <span id="namesText">Traveler</span>?</h1>

            <p>
                The page you're trying to reach wandered off into the digital
                void. It probably took a wrong turn somewhere between your browser
                and reality. Typical internet behavior.
            </p>

            <button onclick="goHome()">
                Return Home
            </button>

        </div>

        <div class="right">

            <div class="glow"></div>

            <div class="circle">
                🦕
            </div>

        </div>

    </div>

    <div class="code">
        <p id="funnyText">Searching alternate timeline...</p>
    </div>

    <script>

    function goHome(){
        window.location.href="/";
    }

    function cycleText(elementId, words, interval = 2000) {
    const el = document.getElementById(elementId);
    let i = 0;

    setInterval(() => {
        el.classList.add("hide");

        setTimeout(() => {
        i = (i + 1) % words.length;
        el.textContent = words[i];
        el.classList.remove("hide");
        }, 400);

    }, interval);
    }

    cycleText(
        "funnyText",
        [
            "Searching alternate timeline...",
            "Convincing the server this page existed...",
            "Following mysterious breadcrumbs...",
            "Consulting the internet goblins...",
            "404 means 'good luck' apparently.",
            "Still less confusing than CSS positioning.",
            "Your page has successfully escaped."
        ],
        3000
    );

    cycleText(
        "namesText",
        [
            "Traveler",
            "Visitor",
            "Friend", 
            "Dinosaur", 
            "Alien", 
            "Guest", 
            "Human", 
            "Fella"
        ],
        2300
    );

    </script>

    </body>
